# interpretdesk.com 反向代理。放 /etc/nginx/sites-available/interpretdesk，再软链到 sites-enabled。
server {
    listen 80;
    listen [::]:80;
    server_name interpretdesk.com www.interpretdesk.com;

    # 证书签发前先让 certbot 走这条验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name interpretdesk.com www.interpretdesk.com;

    ssl_certificate     /etc/letsencrypt/live/interpretdesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interpretdesk.com/privkey.pem;

    # 会前底稿可能是几十页的 PDF，服务端自己限到 20MB，这里给一点余量
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # 实时字幕走 WebSocket，这两行缺一条就连不上
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 会话 cookie 要带 secure，后端靠这个头判断当前是不是 HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
        # 一场会开一两个小时，默认 60 秒会把 WebSocket 掐断
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        # 拟稿是流式输出，缓冲会让字一批一批地蹦
        proxy_buffering off;
    }
}
