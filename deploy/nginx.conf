# interpretdesk.com 反向代理。放 /etc/nginx/sites-available/interpretdesk，再软链到 sites-enabled。
# 本文件是签完证书之后的最终形态（含 443 与限流），证书未签时用 install.sh 里那份只有 80 的。

# 限流。公网上没有这几行，一个脚本就能把磁盘塞满或把 CPU 占死，正在开会的人字幕直接断。
# 按来源 IP 计：常规请求 20 次每秒（突发 40），上传底稿这一条路收到 6 次每分钟（突发 3），
# 同一 IP 最多 20 条并发连接。同一间办公室共用出口 IP 的情况下这个额度仍然够用。
limit_req_zone  $binary_remote_addr zone=mi_general:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=mi_upload:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=mi_conn:10m;
limit_req_status  429;
limit_conn_status 429;
server {
    listen 80;
    listen [::]:80;
    server_name interpretdesk.com www.interpretdesk.com;

    # 证书签发前先让 certbot 走这条验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name interpretdesk.com www.interpretdesk.com;

    ssl_certificate     /etc/letsencrypt/live/interpretdesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interpretdesk.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    limit_req  zone=mi_general burst=40 nodelay;
    limit_conn mi_conn 20;

    # 会前底稿可能是几十页的 PDF，服务端自己限到 20MB，这里给一点余量
    client_max_body_size 25m;

    # 上传底稿单独收紧：一次 20 MB，不限速的话反复传就是往磁盘里灌
    location = /api/context {
        limit_req zone=mi_upload burst=3 nodelay;
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 几十页 PDF 加 OCR 再提炼，别按默认 60 秒掐
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # 实时字幕走 WebSocket，这两行缺一条就连不上
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 会话 cookie 要带 secure，后端靠这个头判断当前是不是 HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
        # 一场会开一两个小时，默认 60 秒会把 WebSocket 掐断
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        # 拟稿是流式输出，缓冲会让字一批一批地蹦
        proxy_buffering off;
    }
}
